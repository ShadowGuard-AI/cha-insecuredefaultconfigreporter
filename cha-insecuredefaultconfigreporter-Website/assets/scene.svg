<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="The studio in three depths: north light crosses the back wall once slowly, the blocked in figure on the canvas relaxes by small degrees across a long interval, and the brayer makes one short pass across its slab at rare intervals">
